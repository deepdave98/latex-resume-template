name: Build resumes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile both templates with XeLaTeX
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          docker_image: ghcr.io/xu-cheng/texlive-alpine@sha256:11383430b9a3e48c0b79339f34d8092f942f897d91ab3749d4899d06731fea7f
          root_file: |
            templates/new-grad-resume.tex
            templates/experienced-resume.tex
          latexmk_use_xelatex: true
          args: -file-line-error -halt-on-error -interaction=nonstopmode
          extra_system_packages: poppler-utils
          post_compile: |
            test "$(pdfinfo new-grad-resume.pdf | awk '/^Pages:/ {print $2}')" = "1"
            test "$(pdfinfo experienced-resume.pdf | awk '/^Pages:/ {print $2}')" = "2"
            mkdir -p /tmp/resume-previews
            pdftoppm -png -singlefile -f 1 -l 1 -r 72 new-grad-resume.pdf /tmp/resume-previews/new-grad
            pdftoppm -png -singlefile -f 1 -l 1 -r 72 experienced-resume.pdf /tmp/resume-previews/experienced-page-1
            pdftoppm -png -singlefile -f 2 -l 2 -r 72 experienced-resume.pdf /tmp/resume-previews/experienced-page-2
            test -s /tmp/resume-previews/new-grad.png
            test -s /tmp/resume-previews/experienced-page-1.png
            test -s /tmp/resume-previews/experienced-page-2.png

            mkdir -p /tmp/new-grad-project /tmp/experienced-project
            cp resume.cls /tmp/new-grad-project/
            cp resume.cls /tmp/experienced-project/
            cp templates/new-grad-resume.tex /tmp/new-grad-project/resume.tex
            cp templates/experienced-resume.tex /tmp/experienced-project/resume.tex
            latexmk -xelatex -file-line-error -halt-on-error -interaction=nonstopmode -cd /tmp/new-grad-project/resume.tex
            latexmk -xelatex -file-line-error -halt-on-error -interaction=nonstopmode -cd /tmp/experienced-project/resume.tex
            test "$(pdfinfo /tmp/new-grad-project/resume.pdf | awk '/^Pages:/ {print $2}')" = "1"
            test "$(pdfinfo /tmp/experienced-project/resume.pdf | awk '/^Pages:/ {print $2}')" = "2"

      - name: Upload PDFs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resume-templates
          if-no-files-found: error
          retention-days: 7
          path: |
            new-grad-resume.pdf
            experienced-resume.pdf
